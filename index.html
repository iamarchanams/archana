<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archana M.S | Digital & Sales Marketing Executive</title>
<meta name="description" content="Portfolio of Archana M.S, Digital & Sales Marketing Executive.">
<meta name="theme-color" content="#d6688f">
<link rel="icon" href="favicon.svg" type="image/svg+xml" id="favicon-link">
<script>
  // Set the theme before first paint so there is no light/dark flash.
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>

<nav class="site-nav">
  <div class="container">
    <a href="#home" class="nav-brand" id="navBrand">Archana M.S</a>
    <div class="nav-right">
      <ul class="nav-links" id="navLinks"></ul>
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Switch between light and dark theme" title="Switch theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    </div>
  </div>
</nav>

<main id="app"><div class="loading">Loading…</div></main>

<footer>
  <div class="container"><span>&copy; <span id="footerYear"></span> <span id="footerName">Archana M.S</span>. All rights reserved.</span></div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">&#8249;</button>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">&#8250;</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCaption"></figcaption></figure>
</div>

<script src="config.js"></script>
<script src="js/normalize.js"></script>
<script src="js/main.js"></script>
</body>
</html>
