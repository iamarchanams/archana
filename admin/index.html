<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Archana M.S Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="loginView" class="login-screen">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p class="muted">Enter the admin PIN to manage this site.</p>
    <form id="pinForm">
      <div class="field-group">
        <input type="password" id="pinInput" inputmode="numeric" autocomplete="off"
               placeholder="PIN" style="text-align:center;font-size:1.3rem;letter-spacing:.2em">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Unlock</button>
    </form>
    <p id="loginError" class="error-text"></p>
  </div>
</div>

<div id="dashboardView" class="dashboard hidden">
  <header class="admin-header">
    <div class="admin-header-inner">
      <span class="admin-title">Archana M.S — Admin</span>
      <div class="admin-header-actions">
        <span id="userLabel" class="muted"></span>
        <button id="previewBtn" class="btn btn-outline btn-sm">Preview</button>
        <button id="publishBtn" class="btn btn-primary btn-sm">Publish Changes</button>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Log out</button>
      </div>
    </div>
    <div id="publishStatus" class="publish-status"></div>
  </header>

  <div class="admin-body">
    <nav class="admin-sidebar" id="sectionNav"></nav>
    <main class="admin-content" id="sectionContent">
      <div class="empty-note">Loading content…</div>
    </main>
  </div>
</div>

<div id="previewModal" class="preview-modal hidden">
  <div class="preview-modal-bar">
    <span>Draft Preview</span>
    <button id="closePreviewBtn" class="btn btn-ghost btn-sm">Close</button>
  </div>
  <iframe id="previewFrame"></iframe>
</div>

<script src="../config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
